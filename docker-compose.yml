services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  s3:
    image: chrislusf/seaweedfs
    ports:
      - "9000:8333"
    command: server -s3 -s3.port=8333

volumes:
  mongo_data:
