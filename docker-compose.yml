services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  s3:
    image: chrislusf/seaweedfs
    ports:
      - "9000:8333"
    command: server -s3 -s3.port=8333

  # Horizontally scalable execution workers (zero untrusted code on API server)
  # Start 4 replicas: npm run workers:scale
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    profiles: ["scale"]
    depends_on:
      - mongodb
      - redis
    environment:
      - MONGO_URI=mongodb://mongodb:27017/interview_platform
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=4
      - IN_DOCKER=true
      - SANDBOX_RUNS_ROOT=/tmp-runs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.tmp-runs:/tmp-runs

volumes:
  mongo_data:
